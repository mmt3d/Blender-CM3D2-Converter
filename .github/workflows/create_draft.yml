name: Create Release Draft on Version Update

env:
  ADDON_DIR: "CM3D2 Converter"
  BL_INFO_SCRIPT: "CM3D2 Converter/__init__.py"

on:
  push:
    branches:
      - bl_33
    paths:
      - "CM3D2 Converter/__init__.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Create Manifest
        id: build_meta
        run: python .github/scripts/create_manifest.py

      - name: Zip extension folder
        run: |
          cd "${{ env.ADDON_DIR }}"
          zip -r ../${{ steps.build_meta.outputs.zip_name }} ./*

      - name: Create Metadata
        env:
          ZIP_NAME: ${{ steps.build_meta.outputs.zip_name }}
          TAG_NAME: v${{ steps.build_meta.outputs.version }}
        run: python .github/scripts/create_metadata.py

      - name: Create GitHub Release Draft with Artifacts
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.build_meta.outputs.zip_name }}
          tag: v${{ steps.build_meta.outputs.version }}
          name: v${{ steps.build_meta.outputs.version }}
          draft: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Store Metadata to Cache
        uses: actions/cache/save@v4
        with:
          path: metadata.json
          key: metadata-${{ github.event.repository.name }}-v${{ steps.build_meta.outputs.version }}-${{ steps.create_release.outputs.id }}
